name: Build Mindustry Mod
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build mod
        run: gradle clean jar --no-daemon --refresh-dependencies
      - name: Verify JAR
        run: |
          JAR="$(find build/libs -maxdepth 1 -name '*.jar' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" | grep -Fx 'zona/ZonaMod.class'
          jar tf "$JAR" | grep -Fx 'mod.hjson'
      - uses: actions/upload-artifact@v4
        with:
          name: The-Aglomeration-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
