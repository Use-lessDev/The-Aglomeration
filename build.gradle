plugins {
    id 'java'
}

version = '0.1.0'

sourceSets.main.java.srcDirs = ['src']

repositories {
    mavenCentral()
    ivy {
        url = 'https://github.com/'
        patternLayout {
            artifact '/[organisation]/[module]/releases/download/[revision]/dependencies.jar'
        }
        metadataSources { artifact() }
    }
}

dependencies {
    compileOnly 'Anuken:Mindustry:v154'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    // Mindustry needs mod.hjson inside the JAR to discover and load the mod.
    from('.') {
        include 'mod.hjson'
        include 'icon.png'
        include 'assets/**'
    }
}
