plugins {
    id 'java'
}
group = 'zona'
version = '1.0.0'
sourceSets { main { java.srcDirs = ['src']; resources.srcDirs = ['assets'] } }
repositories {
    mavenCentral()
    ivy {
        url = 'https://github.com/'
        patternLayout { artifact '/[organisation]/[module]/releases/download/[revision]/Mindustry.jar' }
        metadataSources { artifact() }
    }
}
dependencies { compileOnly 'Anuken:Mindustry:v154' }
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') {
    archiveBaseName = 'The-Aglomeration'
    from('.') { include 'mod.hjson'; include 'icon.png'; include 'assets/**' }
}
