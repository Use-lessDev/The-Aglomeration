plugins {
    id 'java'
}

version = '0.1.0'

sourceSets.main.java.srcDirs = ['src']

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compileOnly 'com.github.Anuken.Mindustry:core:v154'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    // Mindustry needs mod.hjson inside the JAR to discover and load the mod.
    from('.') {
        include 'mod.hjson'
        include 'icon.png'
        include 'assets/**'
    }
}
